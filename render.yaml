# Blueprint de Render: publica cierre-api con una base PostgreSQL administrada.
# No reemplaza a docker-compose.yml (que es lo que usa el calificador); es solo
# para tener la API de consulta en línea. Las credenciales las genera Render.
databases:
  - name: cierre-db
    databaseName: cierre
    user: cierre
    plan: free
    region: oregon

services:
  - type: web
    name: cierre-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./render/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: cierre-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: cierre-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: cierre-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: cierre-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: cierre-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: cierre-db
          property: connectionString
      - key: API_INTERNAL_PORT
        value: "8081"
      - key: PORT
        value: "8081"
